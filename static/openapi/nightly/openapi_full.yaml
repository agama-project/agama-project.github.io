          - array
          - 'null'
        post:
          description: User-defined post-installation scripts
          items:
            $ref: '#/components/schemas/PostScript'
          type:
          - array
          - 'null'
        postPartitioning:
          description: User-defined post-partitioning scripts
          items:
            $ref: '#/components/schemas/PostPartitioningScript'
