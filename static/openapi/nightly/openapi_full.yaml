      - text
      - class
      - actions
      type: object
    RegistrationInfo:
      properties:
        addons:
          description: Available add-ons.
          items:
            $ref: '#/components/schemas/AddonInfo'
          type: array
        code:
          description: Registration code.
          type:
          - string
          - 'null'
        email:
          description: Registration e-mail.
          type:
          - string
          - 'null'
        url:
          description: URL of the registration server.
          format: uri
          type:
          - string
          - 'null'
      required:
      - addons
      type: object
    RepositoryConfig:
      description: Parameters for creating new a repository
      properties:
        alias:
          description: repository alias. Has to be unique
          type: string
        allowUnsigned:
          description: Whenever repository can be unsigned. Default is false
          type:
          - boolean
          - 'null'
        enabled:
          description: Whether the repository is enabled, if missing the repository is enabled
          type:
          - boolean
          - 'null'
        gpgFingerprints:
          description: |-
            List of fingerprints for GPG keys used for repository signing. If specified,
            the new list of fingerprints overrides the existing ones instead of merging
            with them. By default empty.
          items:
            type: string
          type:
          - array
          - 'null'
        name:
          description: repository name, if not specified the alias is used
          type:
          - string
          - 'null'
        priority:
          description: Repository priority, lower number means higher priority, the default priority is 99
          format: int32
          type:
          - integer
          - 'null'
        productDir:
          description: product directory (currently not used, valid only for multiproduct DVDs)
          type:
          - string
          - 'null'
        url:
          description: Repository url (raw format without expanded variables)
          type: string
      required:
      - alias
      - url
      type: object
    RootUserConfig:
      description: |-
        Root user settings

        Holds the settings for the root user.
      properties:
        hashedPassword:
          default: false
          description: Whether the password is hashed or is plain text
          type: boolean
        password:
          description: User password
          examples:
          - nots3cr3t
          type: string
        sshPublicKey:
          anyOf:
          - $ref: '#/components/schemas/StringOrList'
          - type: 'null'
          deprecated: true
          description: Root SSH public key
        sshPublicKeys:
          anyOf:
          - $ref: '#/components/schemas/StringOrList'
          - type: 'null'
          description: Root SSH public key
      title: Root authentication settings
      type: object
    SSLFingerprint:
      properties:
        algorithm:
          allOf:
          - $ref: '#/components/schemas/SSLFingerprintAlgorithm'
          default: SHA256
          description: |-
            Algorithm used to compute SSL certificate fingerprint.
            Supported options are "SHA1" and "SHA256"
        fingerprint:
          description: |-
            The string value for SSL certificate fingerprint.
            Example value is "F6:7A:ED:BB:BC:94:CF:55:9D:B3:BA:74:7A:87:05:EF:67:4E:C2:DB"
          examples:
          - A8:DE:08:B1:57:52:FE:70:DF:D5:31:EA:E3:53:BB:39:EE:01:FF:B9
          type: string
      required:
      - fingerprint
      type: object
    SSLFingerprintAlgorithm:
      enum:
      - SHA1
      - SHA256
      type: string
    Scope:
      description: Scope to distinguish each service.
      enum:
      - access
      - bootloader
      - manager
      - network
      - ntp
      - hostname
      - l10n
      - product
      - proxy
      - questions
      - security
      - software
      - storage
      - files
      - iscsi
      - dasd
      - zfcp
      - users
      type: string
    ScriptsConfig:
      properties:
