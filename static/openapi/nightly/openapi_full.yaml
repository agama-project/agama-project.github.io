      description: Selector option.
      properties:
        id:
          type: string
        label:
          type: string
      required:
      - id
      - label
      type: object
    SoftwareConfig:
      description: Software settings for installation
      properties:
        extraRepositories:
          description: List of user specified repositories to use on top of default ones.
          items:
            $ref: '#/components/schemas/RepositoryConfig'
          type:
          - array
          - 'null'
        onlyRequired:
          description: Flag indicating if only hard requirements should be used by solver.
          type:
          - boolean
          - 'null'
        packages:
          description: List of user selected packages to install.
          examples:
          - - vim
          items:
            type: string
          type:
          - array
          - 'null'
        patterns:
          anyOf:
          - $ref: '#/components/schemas/PatternsConfig'
          - type: 'null'
          description: List of user selected patterns to install.
          examples:
          - - minimal_base
      type: object
    Source:
      description: NTP source configuration.
      properties:
        address:
          description: NTP server or pool address.
          examples:
          - 0.opensuse.pool.ntp.org
          - ntp.example.com
          type: string
        iburst:
          default: false
          description: Send a burst of packets for faster initial synchronization.
          type: boolean
        offline:
          default: false
          description: Start with the source marked as offline (can be activated later).
          type: boolean
        type:
          allOf:
          - $ref: '#/components/schemas/SourceType'
          description: 'Type of NTP source: pool (pool of servers), server (single server), or peer (symmetric association).'
      required:
      - type
      - address
      title: NTP source
      type: object
    SourceType:
      description: NTP source type (pool, server, or peer).
      enum:
      - pool
      - server
      - peer
      type: string
    Stage:
      description: Represents the current state of the installation process.
      oneOf:
      - const: configuring
        description: Configuring the installation
        type: string
      - const: installing
        description: Installing the system
        type: string
      - const: finished
        description: Installation finished
        type: string
      - const: failed
        description: Installation failed
        type: string
    StateSettings:
      description: |-
        Network general settings for the installation like enabling wireless, networking and
        allowing to enable or disable the copy of the network settings to the
        target system
      properties:
        connectivity:
          anyOf:
          - $ref: '#/components/schemas/ConnectivityState'
          - type: 'null'
        copyNetwork:
          type:
          - boolean
          - 'null'
        networkingEnabled:
          type:
          - boolean
          - 'null'
        wirelessEnabled:
          type:
          - boolean
          - 'null'
      type: object
    Status:
      properties:
        progresses:
          description: Active progresses
          items:
            $ref: '#/components/schemas/Progress'
          type: array
        stage:
          allOf:
          - $ref: '#/components/schemas/Stage'
          description: Stage of the installation
        tasks:
          description: Active tasks
          items:
            $ref: '#/components/schemas/Task'
          type: array
      required:
