      additionalProperties: false
      properties:
        active:
          type: boolean
        channel:
          type: string
        deviceName:
          description: Device name assigned by the kernel once it is active.
          type: string
        lun:
          type: string
        wwpn:
          type: string
      required:
      - channel
      - wwpn
      - lun
      - active
      type: object
    access.Config:
      description: |-
        Remote Access configuration.

        Allows to explicitly specify how machine has to be accessed after installation.
      properties:
        ssh:
          anyOf:
          - $ref: '#/components/schemas/AccessValue'
          - type: 'null'
          description: Allows to specify if ssh access has to be enabled after installation or keep product defaults.
        webConsole:
          anyOf:
          - $ref: '#/components/schemas/AccessValue'
          - type: 'null'
          description: Allows to specify if web console access has to be enabled after installation or keep product defaults.
      type: object
    access.ExtendedConfig:
      description: Remote Access extended configuration that is resolved
      properties:
        ssh:
          allOf:
          - $ref: '#/components/schemas/AccessValue'
          description: Remote access to SSH
        webConsole:
          allOf:
          - $ref: '#/components/schemas/AccessValue'
          description: Remote access to Web Console
      required:
      - ssh
      - webConsole
      type: object
    bootloader.Config:
      description: Bootloader configuration.
      properties:
        extraKernelParams:
          description: Bootloader extra kernel parameters.
          type:
          - string
          - 'null'
        stopOnBootMenu:
          description: Whether bootloader should stop on boot menu.
          type:
          - boolean
          - 'null'
        timeout:
          description: Bootloader timeout.
          format: uint32
          minimum: 0
          type:
          - integer
          - 'null'
        updateNvram:
          description: Whether bootloader should update persistent RAM.
          type:
          - boolean
          - 'null'
      title: Bootloader settings
      type: object
    hostname.Config:
      description: Hostname config.
      properties:
        hostname:
          description: System transient hostname.
          examples:
          - agama-host
          type:
          - string
          - 'null'
        static:
          description: System static hostname.
          examples:
          - agama-host.example.com
          type:
          - string
          - 'null'
        transient:
          deprecated: true
          description: System transient hostname.
          examples:
          - agama-host
          type:
          - string
          - 'null'
      title: Hostname settings
      type: object
    hostname.Proposal:
      description: Describes what Agama proposes for the target system.
      properties:
        hostname:
          type: string
        static:
          type:
          - string
          - 'null'
      required:
      - hostname
      type: object
    hostname.SystemInfo:
      description: Describes the current system hostname information
      properties:
        hostname:
          type: string
        static:
          type:
          - string
          - 'null'
      required:
      - hostname
      type: object
    l10n.Config:
      description: Localization config.
      properties:
        keyboard:
          deprecated: true
          description: Keymap (e.g., "us", "cz(qwerty)", etc.).
          examples:
          - us
          - en
          - es
          type:
          - string
          - 'null'
        keymap:
          description: Keymap (e.g., "us", "cz(qwerty)", etc.).
          examples:
          - us
          - en
          - es
          type:
          - string
          - 'null'
        language:
          deprecated: true
          description: Locale (e.g., "en_US.UTF-8").
          examples:
          - en_US.UTF-8
          - en_US
          type:
          - string
          - 'null'
        locale:
          description: Locale (e.g., "en_US.UTF-8").
          examples:
          - en_US.UTF-8
          - en_US
          type:
          - string
          - 'null'
        timezone:
          description: Timezone (e.g., "Europe/Berlin").
          examples:
          - Europe/Berlin
          type:
          - string
          - 'null'
      title: Localization settings
      type: object
    l10n.Proposal:
      description: Describes what Agama proposes for the target system.
      properties:
        keymap:
          description: Keymap (e.g., "us", "cz(qwerty)", etc.).
          type: string
        locale:
          description: Locale (e.g., "en_US.UTF-8").
          type: string
        timezone:
          description: Timezone (e.g., "Europe/Berlin").
          type: string
      required:
      - keymap
      - locale
      - timezone
      type: object
    l10n.SystemConfig:
      properties:
        keymap:
          type:
          - string
          - 'null'
        locale:
          type:
          - string
          - 'null'
      type: object
    l10n.SystemInfo:
      description: Localization-related information of the system where the installer is running.
      properties:
        keymap:
          description: Keymap of the system where Agama is running.
          type: string
        keymaps:
          description: List of known keymaps.
          items:
            $ref: '#/components/schemas/Keymap'
          type: array
        locale:
          description: Locale of the system where Agama is running.
          type: string
        locales:
          description: List of know locales.
          items:
            $ref: '#/components/schemas/LocaleEntry'
          type: array
        timezone:
          description: Timezone of the system where Agama is running.
          type: string
        timezones:
          description: List of known timezones.
          items:
            $ref: '#/components/schemas/TimezoneEntry'
          type: array
      required:
      - locales
      - timezones
      - keymaps
      - locale
      - keymap
      - timezone
      type: object
    network.Config:
      description: Network config settings for installation
      properties:
        connections:
          anyOf:
          - $ref: '#/components/schemas/NetworkConnectionsCollection'
          - type: 'null'
          description: Connections to use in the installation
        state:
          anyOf:
          - $ref: '#/components/schemas/StateSettings'
          - type: 'null'
          description: Network general settings
      type: object
    network.Proposal:
      description: Network proposal settings for installation
      properties:
        connections:
          allOf:
          - $ref: '#/components/schemas/NetworkConnectionsCollection'
          description: Connections to use in the installation
        state:
          allOf:
          - $ref: '#/components/schemas/StateSettings'
          description: General network settings
      required:
      - connections
      - state
      type: object
    network.SystemInfo:
      description: Network settings for installation
      properties:
        accessPoints:
          items:
            $ref: '#/components/schemas/AccessPoint'
          type: array
        connections:
          allOf:
          - $ref: '#/components/schemas/NetworkConnectionsWithStateCollection'
          description: Connections to use in the installation
        devices:
          items:
            $ref: '#/components/schemas/Device'
          type: array
        state:
          $ref: '#/components/schemas/StateSettings'
      required:
      - accessPoints
      - connections
      - devices
      - state
      type: object
    ntp.Config:
      description: NTP configuration.
      properties:
        sources:
          description: NTP sources.
          items:
            $ref: '#/components/schemas/Source'
          type:
          - array
          - 'null'
      title: NTP configuration
      type: object
    proxy.Config:
      description: Proxy config.
      properties:
        enabled:
          description: Whether proxy is enabled.
          type:
          - boolean
          - 'null'
        ftp:
          description: URL to be used for the FTP proxy.
          type:
          - string
          - 'null'
        gopher:
          description: URL to be used for the Gopher proxy.
          type:
          - string
          - 'null'
        http:
          description: URL to be used for the HTTP proxy.
          examples:
          - http://proxy.provider.de:3128/
          type:
          - string
          - 'null'
        https:
          description: URL to be used for the HTTPS proxy.
          type:
          - string
          - 'null'
        noProxy:
          description: Comma-separated list of domains/hosts to bypass proxy for.
          type:
          - string
          - 'null'
        socks:
          description: URL to be used for the SOCKS proxy.
          type:
          - string
          - 'null'
        socks5:
          description: SOCKS5 server address.
          examples:
          - office-proxy.example.com:8881
          type:
          - string
          - 'null'
      title: Proxy settings
      type: object
    questions.Action:
      description: |-
        Question action.

        They are usually presented as the button in a form.
      properties:
        id:
          description: Action value.
          type: string
        label:
          description: Description of the action.
          type: string
      required:
      - id
      - label
      type: object
    questions.Answer:
      description: |-
        Question answer.

        It includes the action and, optionally, and additional value which depends
        on the question field.
      properties:
        action:
          description: Action to use for answering the question.
          type: string
        value:
          description: Value to use for the question (e.g. password or string input, depending on the question type).
          type:
          - string
          - 'null'
      required:
      - action
      title: Predefined question action
      type: object
    questions.Config:
      description: Questions configuration.
      properties:
        answers:
          description: List of answers to automatically use for matching questions.
          items:
            $ref: '#/components/schemas/AnswerRule'
          type:
          - array
          - 'null'
        policy:
          anyOf:
          - $ref: '#/components/schemas/Policy'
          - type: 'null'
          description: 'Policy to answer questions: "auto" to automatically answer questions or "user" to ask the user.'
      title: How to handle Agama questions
      type: object
    security.Config:
      description: Security settings
      properties:
        sslCertificates:
          description: List of SSL certificates to add to the system.
          items:
            $ref: '#/components/schemas/SSLFingerprint'
          type:
          - array
          - 'null'
      title: Security settings
      type: object
    software.Proposal:
      description: Describes what Agama proposes for the target system.
      properties:
        patterns:
          additionalProperties:
            $ref: '#/components/schemas/SelectedBy'
          description: |-
            Patterns selection. It is represented as a hash map where the key is the pattern's name
            and the value why the pattern is selected.
          type: object
        registration:
          description: |-
            Registration proposal. Maybe same as config?
            TODO: implement it
          type: 'null'
        usedSpace:
          description: Space required for installation in KiB.
          format: int64
          type: integer
      type: object
    users.Config:
      description: |-
        User settings

        Holds the user settings for the installation.
      properties:
        root:
          anyOf:
          - $ref: '#/components/schemas/RootUserConfig'
          - type: 'null'
        user:
          anyOf:
          - $ref: '#/components/schemas/FirstUserConfig'
          - type: 'null'
      type: object
  securitySchemes:
    bearerAuth:
      bearerFormat: JWT
      description: JWT token obtained from the authentication endpoint
      scheme: bearer
      type: http
externalDocs:
  description: Full Agama documentation
  url: https://agama-project.github.io
info:
  contact:
    email: agama-devel@lists.opensuse.org
    name: Agama Project Team
    url: https://github.com/agama-project/agama
  description: Complete HTTP API for the Agama installer. See https://agama-project.github.io for more information.
  license:
    name: GPL-2.0
    url: https://www.gnu.org/licenses/old-licenses/gpl-2.0.html
  title: Agama HTTP API
  version: 0.1.0
openapi: 3.1.0
paths:
  /api/action:
    post:
      description: Executes an installation action such as starting the installation process or probing hardware. Some actions may be blocked if there are pending issues or if the system is busy.
      operationId: executeAction
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Action'
        required: true
      responses:
        '200':
          description: no content
        '400':
          content:
            text/plain:
              schema:
                type: string
          description: Failed to parse the request body as JSON
        '415':
          content:
            text/plain:
              schema:
                type: string
          description: 'Expected request with `Content-Type: application/json`'
        '422':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
          description: Action blocked by backend state (e.g., pending issues or system busy)
        '500':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
          description: Internal server error
      summary: Execute action
      tags:
      - Actions
  /api/auth:
    delete:
      description: Invalidates the current session by clearing the authentication cookie. After logout, the token should no longer be used for authenticated requests.
      operationId: logout
      responses:
        '200':
          description: no content
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
          description: Unauthorized - invalid or missing token
      summary: End user session
      tags:
      - Authentication
    get:
      description: Verifies that the current authentication token is valid. Returns 200 if the user is authenticated, 401 otherwise. Use this endpoint to check if a session is still active.
      operationId: checkSession
      responses:
        '200':
          description: no content
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
          description: Unauthorized - invalid or missing token
      summary: Check session status
      tags:
      - Authentication
    post:
      description: Authenticates the user with the provided password and returns a JWT bearer token. The token should be included in the Authorization header for subsequent requests. Also sets an HttpOnly session cookie for browser-based clients.
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
          description: Authentication successful, returns bearer token
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
          description: Authentication failed - invalid credentials
      security: []
      summary: Authenticate user
      tags:
      - Authentication
  /api/config:
    get:
      description: Returns the current user-defined configuration.
      operationId: getConfiguration
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Config'
          description: Configuration retrieved successfully
        '500':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
          description: Internal server error
      summary: Get configuration
      tags:
      - Configuration
    patch:
      description: Partially updates the configuration. Only the specified fields will be changed, all other fields remain unchanged. This is the preferred method for making incremental configuration changes.
      operationId: patchConfiguration
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Patch'
        description: Patch for the config.
        required: true
      responses:
        '200':
          description: no content
        '400':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
          description: Invalid configuration schema or malformed JSON
        '415':
          content:
            text/plain:
              schema:
                type: string
          description: 'Expected request with `Content-Type: application/json`'
        '422':
          content:
            text/plain:
              schema:
                type: string
          description: Failed to deserialize the JSON body into the target type
        '500':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
          description: Internal server error
      summary: Patch configuration
      tags:
      - Configuration
    put:
      description: Replaces the entire configuration. Any fields not included in the request will be removed from the configuration. For partial updates, use PATCH instead. The request body should be a JSON object conforming to the Config schema.
      operationId: updateConfiguration
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Config'
        description: Profile definition for automated installation.
        required: true
      responses:
        '200':
          description: no content
        '400':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
          description: Invalid configuration schema or malformed JSON
        '415':
          content:
            text/plain:
              schema:
                type: string
          description: 'Expected request with `Content-Type: application/json`'
        '422':
          content:
            text/plain:
              schema:
                type: string
          description: Failed to deserialize the JSON body into the target type
        '500':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
          description: Internal server error
      summary: Update configuration
      tags:
      - Configuration
  /api/extended_config:
    get:
      description: Returns the extended configuration including computed defaults and system-generated values. Use this endpoint to see the complete configuration including values not explicitly set by the user.
      operationId: getExtendedConfiguration
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Config'
          description: Extended configuration retrieved successfully
        '500':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
          description: Internal server error
      summary: Get extended configuration
      tags:
      - Configuration
  /api/issues:
    get:
      description: Returns the list of all current issues detected during the installation process. Issues represent problems or warnings that may need to be addressed before proceeding with the installation.
      operationId: listIssues
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/IssueWithScope'
                type: array
          description: List of issues with their scopes
        '500':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
          description: Internal server error
      summary: List issues
      tags:
      - Issues & Questions
  /api/licenses/{id}:
    get:
      description: Returns the content of a specific license. The license is always returned in the current system language (see the ConfigureL10n action).
      operationId: getLicenseById
      parameters:
      - description: License identifier (e.g., "license.final")
        in: path
        name: id
        required: true
        schema:
          description: License identifier (e.g., "license.final")
          type: string
        style: simple
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LicenseContent'
          description: License retrieved successfully
        '404':
          description: no content
        '500':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
          description: Internal server error
      summary: Get license by ID
      tags:
      - System & Monitoring
  /api/proposal:
    get:
      description: Returns the proposed configuration for the target system. The proposal is generated based on the current configuration and represents how the system will be configured when installed.
      operationId: getInstallationProposal
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Proposal'
          description: Proposal successfully retrieved
        '404':
          description: no content
        '500':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
          description: Internal server error
      summary: Get installation proposal
      tags:
      - Configuration
  /api/questions:
    get:
      description: Returns all pending questions that require user input. Questions represent interactive prompts where the installer needs additional information or decisions from the user.
      operationId: listQuestions
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/Question'
                type: array
          description: List of pending questions
        '500':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
          description: Internal server error
      summary: List questions
      tags:
      - Issues & Questions
    patch:
      description: Updates the question collection by answering or removing a question. Use this endpoint to provide an answer to a pending question or to dismiss it.
      operationId: updateQuestion
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateQuestion'
        description: |-
          Represents an update operation over the list of questions.

          It is used by the HTTP layer only.
        required: true
      responses:
        '200':
          description: no content
        '400':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
          description: Malformed JSON
        '415':
          content:
            text/plain:
              schema:
                type: string
          description: 'Expected request with `Content-Type: application/json`'
        '422':
          content:
            text/plain:
              schema:
                type: string
          description: Failed to deserialize the JSON body into the target type
        '500':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
          description: Internal server error
      summary: Update question
      tags:
      - Issues & Questions
    post:
      description: Registers a new question for user interaction. The question will be added to the list of pending questions and can be answered or deleted later.
      operationId: createQuestion
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuestionSpec'
        description: |-
          Defines how a question should look like.

          A question is composed by a set of actions and, optionally, and additional
          field. For instance, a question to decrypt a device using a password would have:

          * a pair of actions, "decrypt" and "skip".
          * a password field.

          In other cases, like a simple "yes/no" questions, the field would not be needed.
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Question'
          description: Question created successfully
        '400':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
          description: Malformed JSON
        '415':
          content:
            text/plain:
              schema:
                type: string
          description: 'Expected request with `Content-Type: application/json`'
        '422':
          content:
            text/plain:
              schema:
                type: string
          description: Failed to deserialize the JSON body into the target type
        '500':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
          description: Internal server error
      summary: Create question
      tags:
      - Issues & Questions
  /api/status:
    get:
      description: Returns the current status of the installation process, including the current stage and the progress of the ongoing actions. This endpoint can be polled to monitor installation progress.
      operationId: getInstallerStatus
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
          description: Status of the installation
        '500':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
          description: Internal server error
      summary: Get installer status
      tags:
      - System & Monitoring
  /api/system:
    get:
      description: Returns detailed information about the installation system including hardware details, platform information, and system capabilities. It includes Agama specific information like the list of available products for installation.
      operationId: getSystemInfo
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemInfo'
          description: System information retrieved successfully
        '500':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
          description: Internal server error
      summary: Get system information
      tags:
      - System & Monitoring
security:
- bearerAuth: []
servers:
- description: Agama instance URL
  url: '{agamaUrl}'
  variables:
    agamaUrl:
      default: https://agama.local
      description: URL of the Agama instance
tags:
- description: User authentication and session management
  name: Authentication
- description: System information, installation status, and progress monitoring
  name: System & Monitoring
- description: System configuration management
  name: Configuration
- description: Installation actions and commands
  name: Actions
- description: Problem tracking and interactive questions
  name: Issues & Questions
