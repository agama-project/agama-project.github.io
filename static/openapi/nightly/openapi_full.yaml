    ProblemDetails:
      description: |-
        Problem Details for HTTP APIs (RFC 9457)

        This enum represents different types of API errors following RFC 9457.
        Each variant contains only the fields relevant to that specific error type.

        The `type` field (used for i18n) is determined by the enum variant,
        and the HTTP status code is determined by the server.

        # Examples

        Deserializing a schema validation error from JSON:

        ```
        # use agama_utils::api::ProblemDetails;
        let json = r#"{
          "type": "tag:agama.opensuse.org,2026:problems/schema-validation-failed",
          "title": "Schema Validation Failed",
          "detail": "The provided configuration does not match the required schema",
          "errors": ["/network/hostname: is required"]
        }"#;

        let problem: ProblemDetails = serde_json::from_str(json).unwrap();
        match problem {
            ProblemDetails::SchemaValidationFailed { errors, .. } => {
                assert_eq!(errors.len(), 1);
            }
            _ => panic!("Expected SchemaValidationFailed"),
        }
        ```
      oneOf:
      - description: Schema validation failed (HTTP 400)
        properties:
          detail:
            description: Detailed explanation
            type:
            - string
            - 'null'
          errors:
            description: List of validation error messages
            items:
              type: string
            type: array
          title:
            description: Short summary
            type: string
          type:
            const: tag:agama.opensuse.org,2026:problems/schema-validation-failed
            type: string
        required:
        - type
        - title
        - errors
        type: object
      - description: Invalid JSON in request body (HTTP 400)
        properties:
          detail:
            type:
            - string
            - 'null'
          title:
            type: string
          type:
            const: tag:agama.opensuse.org,2026:problems/invalid-json
            type: string
        required:
        - type
        - title
        type: object
      - description: Internal server error (HTTP 500)
        properties:
          detail:
            type: string
          title:
            type: string
          type:
            const: tag:agama.opensuse.org,2026:problems/internal-error
            type: string
        required:
        - type
        - title
        - detail
        type: object
      - description: Unauthorized - authentication required (HTTP 401)
        properties:
          detail:
            type: string
          title:
            type: string
          type:
            const: tag:agama.opensuse.org,2026:problems/unauthorized
            type: string
        required:
        - type
        - title
        - detail
        type: object
      - description: Generic error without specific type (HTTP 500)
        properties:
          detail:
            type: string
          title:
            type: string
          type:
            const: about:blank
            type: string
        required:
        - type
        - title
        - detail
        type: object
      - description: Generic client error (HTTP 400)
        properties:
          detail:
            type: string
          title:
            type: string
          type:
            const: tag:agama.opensuse.org,2026:problems/bad-request
            type: string
        required:
        - type
        - title
        - detail
        type: object
