components:
  schemas:
    AccessPoint:
      description: Access Point
      properties:
        device:
          type: string
        flags:
          format: uint32
          minimum: 0
          type: integer
        hwAddress:
          type: string
        rsnFlags:
          format: uint32
          minimum: 0
          type: integer
        ssid:
          type: string
        strength:
          format: uint8
          maximum: 255
          minimum: 0
          type: integer
        wpaFlags:
          format: uint32
          minimum: 0
          type: integer
      required:
      - device
      - ssid
      - hwAddress
      - strength
      - flags
      - rsnFlags
      - wpaFlags
      type: object
    AccessValue:
      description: Allows to specify explicit enablement of remote access for supported services
      oneOf:
      - const: enabled
        description: Explicitly enabled
        type: string
      - const: default
        description: Default system configuration behavior that is product specific
        type: string
    Action:
      oneOf:
      - enum:
        - activateStorage
        - install
        type: string
      - additionalProperties: false
        description: Performs an iSCSI discovery, finding nodes from the given portal.
        properties:
          discoverISCSI:
            $ref: '#/components/schemas/DiscoverConfig'
        required:
        - discoverISCSI
        type: object
      - additionalProperties: false
        description: |-
          Probes hardware and refreshes services (storage, DASD, software, etc).

          If `only` is not given, it probes everything.
        properties:
          probe:
            properties:
              only:
                items:
                  $ref: '#/components/schemas/Scope'
                type:
                - array
                - 'null'
            type: object
        required:
        - probe
        type: object
      - additionalProperties: false
        properties:
          configureL10n:
            $ref: '#/components/schemas/l10n.SystemConfig'
        required:
        - configureL10n
        type: object
      - additionalProperties: false
        properties:
          finish:
            $ref: '#/components/schemas/FinishMethod'
        required:
        - finish
        type: object
    AddonConfig:
      description: Addon settings for registration
      properties:
        id:
          description: ID of the addon.
          examples:
          - sle-ha
          type: string
        registrationCode:
          description: Registration code for the addon. Free extensions do not require a registration code.
          type:
          - string
          - 'null'
        version:
          description: |-
            Optional version of the addon. It is mandatory if there are multiple available versions.
            If not specified, the version is found from the available addons.
          type:
          - string
          - 'null'
      required:
      - id
      title: List of add-ons to activate
      type: object
    AddonInfo:
      description: Addon registration
      properties:
        available:
          description: Whether the addon is mirrored on the RMT server, on SCC it is always `true`
          type: boolean
        description:
          description: Short description of the addon (translated)
          type: string
        free:
          description: Whether a registration code is required for registering the addon
          type: boolean
        id:
          description: Addon identifier
          type: string
        label:
          description: User visible name
          type: string
        recommended:
          description: Whether the addon is recommended for the users
          type: boolean
        registration:
          allOf:
          - $ref: '#/components/schemas/AddonRegistration'
          description: Whether the addon is registered
        release:
          description: Release status of the addon, e.g. "beta"
          type: string
        version:
          description: Version of the addon
          type: string
      required:
      - id
      - version
      - label
      - available
      - free
      - recommended
      - description
      - release
      - registration
      type: object
    AddonRegistration:
      oneOf:
      - properties:
          code:
            type:
            - string
            - 'null'
          status:
            const: registered
            type: string
        required:
        - status
        type: object
      - properties:
          status:
            const: notRegistered
            type: string
        required:
        - status
        type: object
    AnswerRule:
      description: |-
        Defines the answer to use for any question which matches the rule.

        If the rule matches with the question ([class](Self::class),
        [text](Self::text) or [data](Self::data), it applies the specified `answer`).
      properties:
        action:
          description: Action to use for answering the question.
          type: string
        class:
          description: Question class (see [QuestionSpec::class]).
          examples:
          - multipathActivation
          type:
          - string
          - 'null'
        data:
          additionalProperties:
            type: string
          description: |-
            A question can include custom data. If any of the entries matches,
            the rule is applied (see [QuestionSpec::data]).
          type:
          - object
          - 'null'
        text:
          description: Question text (see [QuestionSpec::text]).
          type:
          - string
          - 'null'
        value:
          description: Value to use for the question (e.g. password or string input, depending on the question type).
          type:
          - string
          - 'null'
      required:
      - action
      title: Automatic answer to questions
      type: object
    AuthResponse:
      $schema: https://json-schema.org/draft/2020-12/schema
      properties:
        token:
          description: Bearer token to use on subsequent calls
          type: string
      required:
      - token
      title: AuthResponse
      type: object
    BondSettings:
      properties:
        mode:
          type: string
        options:
          type:
          - string
          - 'null'
        ports:
          items:
            type: string
          type: array
      required:
      - mode
      type: object
    BootloaderSystemInfo:
      additionalProperties: false
      description: API description of the bootloader system
      properties:
        availableBootloaders:
          description: Possible bootloaders to select in the current system.
          items:
            $ref: '#/components/schemas/BootloaderSystemInfoBootloader'
          type: array
      required:
      - availableBootloaders
      title: System
      type: object
    BootloaderSystemInfoBootloader:
      additionalProperties: false
      properties:
        encryptionAuth:
          description: Encryption authentication methods that can be managed by the bootloader in this system.
          items:
            $ref: '#/components/schemas/BootloaderSystemInfoEncryptionAuthMethod'
          type: array
        type:
          $ref: '#/components/schemas/BootloaderSystemInfoBootloaderType'
      required:
      - type
      - encryptionAuth
      type: object
    BootloaderSystemInfoBootloaderType:
      enum:
      - grub2
      - grub2-bls
      - systemd-boot
    BootloaderSystemInfoEncryptionAuthMethod:
      enum:
      - password
      - tpm
    BridgeSettings:
      properties:
        forwardDelay:
          format: uint32
          minimum: 0
          type:
          - integer
          - 'null'
        helloTime:
          format: uint32
          minimum: 0
          type:
          - integer
          - 'null'
        maxAge:
          format: uint32
          minimum: 0
          type:
          - integer
          - 'null'
        ports:
          items:
            type: string
          type: array
        priority:
          format: uint32
          minimum: 0
          type:
          - integer
          - 'null'
        stp:
          type:
          - boolean
          - 'null'
      type: object
    Config:
      additionalProperties: false
      description: Profile definition for automated installation.
      properties:
        $schema:
          description: The schema location is ignored by the installer, it always uses the built-in schema, but it can be useful for automatic validation and code completion in some editors.
          title: URL of the JSON validation schema
          type: string
        access:
          anyOf:
          - $ref: '#/components/schemas/access.Config'
          - type: 'null'
          description: Remote access configuration (SSH, Web Console).
        bootloader:
          anyOf:
          - $ref: '#/components/schemas/bootloader.Config'
          - type: 'null'
          description: Bootloader configuration.
        dasd:
          $ref: '#/components/schemas/DasdConfig'
        files:
          description: User-defined files to deploy after installation just before post install scripts.
          items:
            $ref: '#/components/schemas/UserFile'
          type:
          - array
          - 'null'
        hostname:
          anyOf:
          - $ref: '#/components/schemas/hostname.Config'
          - type: 'null'
          description: Hostname configuration.
        iscsi:
          $ref: '#/components/schemas/IscsiConfig'
        l10n:
          anyOf:
          - $ref: '#/components/schemas/l10n.Config'
          - type: 'null'
          description: Localization configuration (keyboard, language, timezone).
        legacyAutoyastStorage:
          description: Accepts all options of the AutoYaST partitioning section (i.e., XML to JSON).
        localization:
          $ref: '#/components/schemas/l10n.Config'
          deprecated: true
          description: 'Deprecated: use l10n instead.'
          title: Localization settings (old schema)
        network:
          anyOf:
          - $ref: '#/components/schemas/network.Config'
          - type: 'null'
          description: Network configuration (interfaces, connections, state).
        ntp:
          anyOf:
          - $ref: '#/components/schemas/ntp.Config'
          - type: 'null'
          description: NTP time synchronization configuration.
        product:
          anyOf:
          - $ref: '#/components/schemas/ProductConfig'
          - type: 'null'
          description: Product related configuration
        proxy:
          anyOf:
          - $ref: '#/components/schemas/proxy.Config'
          - type: 'null'
          description: Network proxy configuration.
        questions:
          anyOf:
          - $ref: '#/components/schemas/questions.Config'
          - type: 'null'
          description: Automated question answering rules and policy.
        root:
          anyOf:
          - $ref: '#/components/schemas/RootUserConfig'
          - type: 'null'
        scripts:
          anyOf:
          - $ref: '#/components/schemas/ScriptsConfig'
          - type: 'null'
          description: User-defined scripts to run at different points of the installation.
        security:
          anyOf:
          - $ref: '#/components/schemas/security.Config'
          - type: 'null'
          description: Security configuration (e.g. SSL certificate fingerprints).
        software:
          anyOf:
          - $ref: '#/components/schemas/SoftwareConfig'
          - type: 'null'
          description: Software related configuration
        storage:
          $ref: '#/components/schemas/StorageConfig'
        user:
          anyOf:
          - $ref: '#/components/schemas/FirstUserConfig'
          - type: 'null'
        zfcp:
          $ref: '#/components/schemas/ZfcpConfig'
      title: Profile
      type: object
    ConnectionState:
      oneOf:
      - const: unknown
        description: The connection state is unknown.
        type: string
      - const: activating
        description: The connection is getting activated.
        type: string
      - const: activated
        description: The connection is activated.
        type: string
      - const: deactivating
        description: The connection is getting deactivated.
        type: string
      - const: deactivated
        description: The connection is deactivated.
        type: string
    ConnectivityState:
      description: Network connectivity state.
      oneOf:
      - const: unknown
        description: The connectivity state is unknown.
        type: string
      - const: none
        description: No connectivity.
        type: string
      - const: portal
        description: The network is behind a captive portal and cannot reach the full internet.
        type: string
      - const: limited
        description: The network is connected but it has no access to the full internet.
        type: string
      - const: full
        description: The network is connected and it has access to the full internet.
        type: string
    DasdConfig:
      additionalProperties: false
      description: DASD config.
      properties:
        devices:
          description: List of DASD devices.
          items:
            $ref: '#/components/schemas/DasdConfigDevice'
          type: array
      title: Config
      type: object
    DasdConfigDevice:
      additionalProperties: false
      properties:
        channel:
          description: DASD device channel.
          type: string
        diag:
          description: If device have set diag flag. If not specified then it keep what device has before.
          type: boolean
        format:
          description: If device should be formatted. If not specified then it format device only if not already formatted.
          type: boolean
        state:
          default: active
          description: Specify target state of device. Either activate it or deactivate it.
          enum:
          - active
          - offline
      required:
      - channel
      type: object
    DasdSystemInfo:
      additionalProperties: false
      description: API description of the DASD system
      properties:
        devices:
          description: DASD devices
          items:
            $ref: '#/components/schemas/DasdSystemInfoDevice'
          type: array
      required:
      - devices
      title: System
      type: object
    DasdSystemInfoDevice:
      additionalProperties: false
      properties:
        accessType:
          type: string
        active:
          type: boolean
        channel:
          type: string
        deviceName:
          type: string
        diag:
          type: boolean
        formatted:
          type: boolean
        partitionInfo:
          type: string
        status:
          type: string
        type:
          type: string
      required:
      - channel
      - deviceName
      - type
      - diag
      - accessType
      - partitionInfo
      - status
      - active
      - formatted
      type: object
    DesktopSelection:
      description: Desktop selection mode for a product
      enum:
      - optional
      - suggested
      type: string
    Device:
      description: Network device
      properties:
        busPath:
          description: Physical location of the device, e.g. "pci-0000:c5:00.3".
          type:
          - string
          - 'null'
        carrier:
          description: Whether the device currently has a link (carrier).
          type:
          - boolean
          - 'null'
        connection:
          type:
          - string
          - 'null'
        driver:
          description: Kernel driver in use, e.g. "e1000e".
          type:
          - string
          - 'null'
        ipConfig:
          anyOf:
          - $ref: '#/components/schemas/IpConfig'
          - type: 'null'
        macAddress:
          type: string
        mtu:
          format: uint32
          minimum: 0
          type:
          - integer
          - 'null'
        name:
          type: string
        speed:
          description: |-
            Link speed in Mb/s, when the device reports one.

            Only wired devices report a speed, and only while the link is up.
          format: uint32
          minimum: 0
          type:
          - integer
          - 'null'
        state:
          $ref: '#/components/schemas/DeviceState'
        type:
          $ref: '#/components/schemas/DeviceType'
      required:
      - name
      - type
      - macAddress
      - state
      type: object
    DeviceState:
      description: Network device state.
      oneOf:
      - const: unknown
        description: The device's state is unknown.
        type: string
      - const: unmanaged
        description: The device is recognized but not managed by Agama.
        type: string
      - const: unavailable
        description: The device is detected but it cannot be used (wireless switched off, missing firmware, etc.).
        type: string
      - const: connecting
        description: The device is connecting to the network.
        type: string
      - const: connected
        description: The device is successfully connected to the network.
        type: string
      - const: disconnecting
        description: The device is disconnecting from the network.
        type: string
      - const: disconnected
        description: The device is disconnected from the network.
        type: string
      - const: failed
        description: The device failed to connect to a network.
        type: string
    DeviceType:
      enum:
      - loopback
      - ethernet
      - wireless
      - dummy
      - bond
      - vlan
      - bridge
      type: string
    Dhcp4Settings:
      properties:
        client_id:
          $ref: '#/components/schemas/DhcpClientId'
        hostname:
          type:
          - string
          - 'null'
        iaid:
          $ref: '#/components/schemas/DhcpIaid'
        send_hostname:
          type:
          - boolean
          - 'null'
        send_release:
          type:
          - boolean
          - 'null'
      required:
      - client_id
      - iaid
      type: object
    Dhcp6Settings:
      properties:
        duid:
          $ref: '#/components/schemas/DhcpDuid'
        hostname:
          type:
          - string
          - 'null'
        iaid:
          $ref: '#/components/schemas/DhcpIaid'
        send_hostname:
          type:
          - boolean
          - 'null'
        send_release:
          type:
          - boolean
          - 'null'
      required:
      - duid
      - iaid
      type: object
    DhcpClientId:
      oneOf:
      - enum:
        - Mac
        - PermMac
        - Ipv6Duid
        - Duid
        - Stable
        - None
        - Unset
        type: string
      - additionalProperties: false
        properties:
          Id:
            type: string
        required:
        - Id
        type: object
    DhcpDuid:
      oneOf:
      - enum:
        - Lease
        - Llt
        - Ll
        - StableLlt
        - StableLl
        - StableUuid
        - Unset
        type: string
      - additionalProperties: false
        properties:
          Id:
            type: string
        required:
        - Id
        type: object
    DhcpIaid:
      oneOf:
      - enum:
        - Mac
        - PermMac
        - Ifname
        - Stable
        - Unset
        type: string
      - additionalProperties: false
        properties:
          Id:
            type: string
        required:
        - Id
        type: object
    DiscoverConfig:
      properties:
        address:
          type: string
        initiatorPassword:
          type:
          - string
          - 'null'
        initiatorUsername:
          type:
          - string
          - 'null'
        password:
          type:
          - string
          - 'null'
        port:
          format: uint32
          minimum: 0
          type: integer
        username:
          type:
          - string
          - 'null'
      required:
      - address
      - port
      type: object
    FinishMethod:
      description: Finish method
      oneOf:
      - const: halt
        description: Halt the system
        type: string
      - const: reboot
        description: Reboots the system
        type: string
      - const: stop
        description: Do nothing at the end of the installation
        type: string
      - const: poweroff
        description: Poweroff the system
        type: string
    FirstUserConfig:
      description: |-
        First user settings

        Holds the settings for the first user.
      properties:
        fullName:
          description: First user's full name
          examples:
          - Jane Doe
          type:
          - string
          - 'null'
        hashedPassword:
          default: false
          description: Whether the password is hashed or is plain text
          type: boolean
        password:
          description: User password
          examples:
          - nots3cr3t
          type: string
        sshPublicKey:
          anyOf:
          - $ref: '#/components/schemas/StringOrList'
          - type: 'null'
          deprecated: true
        sshPublicKeys:
          anyOf:
          - $ref: '#/components/schemas/StringOrList'
          - type: 'null'
        userName:
          description: First user's username
          examples:
          - jane.doe
          type:
          - string
          - 'null'
      title: First user settings
      type: object
    HardwareInfo:
      description: Represents the hardware information of the underlying system.
      properties:
        cpu:
          description: CPU description.
          type:
          - string
          - 'null'
        memory:
          description: Memory size (in bytes).
          format: uint64
          minimum: 0
          type:
          - integer
          - 'null'
        model:
          description: Computer model.
          type:
          - string
          - 'null'
      type: object
    IEEE8021XSettings:
      description: IEEE 802.1x (EAP) settings
      properties:
        anonymousIdentity:
          description: Anonymous identity string for EAP authentication methods
          type:
          - string
          - 'null'
        caCert:
          description: Path to CA certificate
          type:
          - string
          - 'null'
        caCertPassword:
          description: Password string for CA certificate if it is encrypted
          type:
          - string
          - 'null'
        clientCert:
          description: Path to client certificate
          type:
          - string
          - 'null'
        clientCertPassword:
          description: Password string for client certificate if it is encrypted
          type:
          - string
          - 'null'
        eap:
          description: List of EAP methods used
          items:
            type: string
          type: array
        identity:
          description: Identity string, often for example the user's login name
          type:
          - string
          - 'null'
        password:
          description: Password string used for EAP authentication
          type:
          - string
          - 'null'
        peapLabel:
          description: Force the use of the new PEAP label during key derivation
          type: boolean
        peapVersion:
          description: Which PEAP version is used when PEAP is set as the EAP method in the 'eap' property
          type:
          - string
          - 'null'
        phase2Auth:
          description: Phase 2 inner auth method
          type:
          - string
          - 'null'
        privateKey:
          description: Path to private key
          type:
          - string
          - 'null'
        privateKeyPassword:
          description: Password string for private key if it is encrypted
          type:
          - string
          - 'null'
      required:
      - eap
      type: object
    InitScript:
      anyOf:
      - description: File or script content, starting with a shebang for scripts.
        properties:
          content:
            type: string
        required:
        - content
        type: object
      - description: Absolute or relative URL to fetch the file or script from.
        properties:
          url:
            type: string
        required:
        - url
        type: object
      description: |-
        Represents a script that runs during the first boot of the target system,
        once the installation is finished.
      properties:
        name:
          description: Script name, to be used as file name.
          type: string
      required:
      - name
      type: object
    IpConfig:
      properties:
        addresses:
          items:
            $ref: '#/components/schemas/IpInet'
          type: array
        dhcp4Settings:
          anyOf:
          - $ref: '#/components/schemas/Dhcp4Settings'
          - type: 'null'
        dhcp6Settings:
          anyOf:
          - $ref: '#/components/schemas/Dhcp6Settings'
          - type: 'null'
        dnsPriority4:
          format: int32
          type:
          - integer
          - 'null'
        dnsPriority6:
          format: int32
          type:
          - integer
          - 'null'
        dnsSearchList:
          items:
            type: string
          type: array
        gateway4:
          format: ip
          type:
          - string
          - 'null'
        gateway6:
          format: ip
          type:
          - string
          - 'null'
        ignoreAutoDns:
          type: boolean
        ignoreAutoRoutes4:
          type:
          - boolean
          - 'null'
        ignoreAutoRoutes6:
          type:
          - boolean
          - 'null'
        ip6Privacy:
          format: int32
          type:
          - integer
          - 'null'
        linkLocal4:
          $ref: '#/components/schemas/LinkLocal'
        method4:
          anyOf:
          - $ref: '#/components/schemas/Ipv4Method'
          - type: 'null'
        method6:
          anyOf:
          - $ref: '#/components/schemas/Ipv6Method'
          - type: 'null'
        nameservers:
          items:
            format: ip
            type: string
          type: array
        neverDefault4:
          type:
          - boolean
          - 'null'
        neverDefault6:
          type:
          - boolean
          - 'null'
        routes4:
          items:
            $ref: '#/components/schemas/IpRoute'
          type: array
        routes6:
          items:
            $ref: '#/components/schemas/IpRoute'
          type: array
      required:
      - ignoreAutoDns
      - linkLocal4
      type: object
    IpInet:
      description: An IP address (IPv4 or IPv6) with prefix length in CIDR notation
      examples:
      - 192.168.1.254/24
      - 2001:db8::/32
      type: string
    IpRoute:
      properties:
        destination:
          $ref: '#/components/schemas/IpInet'
        metric:
          format: uint32
          minimum: 0
          type:
          - integer
          - 'null'
        nextHop:
          type:
          - string
          - 'null'
      required:
      - destination
      type: object
    Ipv4Method:
      enum:
      - disabled
      - auto
      - manual
      - linkLocal
      - shared
      type: string
    Ipv6Method:
      enum:
      - disabled
      - auto
      - manual
      - linkLocal
      - ignore
      - dhcp
      - shared
      type: string
    IscsiConfig:
      additionalProperties: false
      description: iSCSI config.
      properties:
        initiator:
          description: Initiator name.
          type: string
        targets:
          description: List of targets.
          items:
            $ref: '#/components/schemas/IscsiConfigTarget'
          type: array
      title: Config
      type: object
    IscsiConfigAuthentication:
      additionalProperties: false
      properties:
        password:
          type: string
        username:
          type: string
      required:
      - username
      - password
      type: object
    IscsiConfigTarget:
      additionalProperties: false
      properties:
        address:
          description: IP address.
          type: string
        authByInitiator:
          $ref: '#/components/schemas/IscsiConfigAuthentication'
        authByTarget:
          $ref: '#/components/schemas/IscsiConfigAuthentication'
        interface:
          type: string
        name:
          type: string
        port:
          minimum: 0
          type: integer
        startup:
          enum:
          - onboot
          - manual
          - automatic
