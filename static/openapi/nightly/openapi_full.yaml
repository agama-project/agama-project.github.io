    SelectedBy:
      description: Represents the reason why a pattern is selected.
      oneOf:
      - enum:
        - removed
        type: string
      - const: user
        description: The pattern was selected by the user.
        type: string
      - const: auto
        description: The pattern was selected automatically.
        type: string
      - const: none
        description: The pattern has not been selected.
        type: string
